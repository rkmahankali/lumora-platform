<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Users — Klumora Admin</title>
<style>
:root{--bg:#07080D;--srf:#111318;--srf2:#1A1D26;--border:rgba(255,255,255,.07);--gold:#E9B84A;--gold-bg:rgba(233,184,74,.10);--text:#E8E6DF;--sub:#9A9CAA;--muted:#4A4D5E;--green:#4ade80;--amber:#fbbf24;--blue:#38bdf8;--purple:#a78bfa;--red:#f87171;--nav-h:64px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none} button{cursor:pointer;font-family:inherit}
nav{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(7,8,13,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem}
.nav-logo canvas{width:28px;height:28px}
.nav-right{display:flex;gap:12px;align-items:center}
.nav-btn{padding:8px 16px;border-radius:100px;font-size:.875rem;font-weight:600;border:1px solid var(--border);background:var(--srf2);color:var(--text)}
.admin-bar{background:rgba(233,184,74,.06);border-bottom:1px solid rgba(233,184,74,.15);padding:10px 32px;display:flex;align-items:center;gap:10px;font-size:.8rem}
.admin-badge{padding:3px 10px;background:var(--gold-bg);border:1px solid rgba(233,184,74,.25);border-radius:100px;color:var(--gold);font-weight:800;font-size:.72rem}
.page-body{max-width:1400px;margin:0 auto;padding:28px 32px 60px}
/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.stat-box{background:var(--srf);border:1px solid var(--border);border-radius:13px;padding:16px;text-align:center}
.stat-n{font-size:1.8rem;font-weight:900;font-family:Georgia,serif;color:var(--gold)}
.stat-l{font-size:.72rem;color:var(--sub);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
/* tabs */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:12px 18px;font-size:.875rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-content{display:none}.tab-content.active{display:block}
/* search bar */
.search-bar-sm{display:flex;gap:8px;margin-bottom:16px}
.search-bar-sm input{flex:1;padding:9px 14px;background:var(--srf2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;outline:none;font-family:inherit}
.search-bar-sm input:focus{border-color:var(--gold)}
.search-bar-sm select{padding:9px 14px;background:var(--srf2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;outline:none;cursor:pointer}
/* creator grid */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cc{background:var(--srf);border:1px solid var(--border);border-radius:13px;padding:16px;transition:border-color .15s}
.cc:hover{border-color:rgba(233,184,74,.3)}
.cc-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.cc-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.88rem;flex-shrink:0}
.cc-name{font-size:.9rem;font-weight:700}
.cc-meta{font-size:.74rem;color:var(--sub);margin-top:1px}
.cc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.cc-tag{padding:2px 8px;border-radius:100px;font-size:.65rem;font-weight:700;background:var(--srf2);border:1px solid var(--border)}
.cc-tag.gold{background:var(--gold-bg);border-color:rgba(233,184,74,.25);color:var(--gold)}
.cc-tag.green{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.2);color:var(--green)}
.cc-tag.blue{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.2);color:var(--blue)}
.cc-tag.purple{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.2);color:var(--purple)}
.cc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:.74rem;text-align:center}
.cc-stat{background:var(--srf2);border-radius:8px;padding:6px 4px}
.cc-sn{font-weight:800;color:var(--gold);font-size:.86rem}
.cc-sl{color:var(--muted);margin-top:1px}
/* client table */
.client-table{width:100%;border-collapse:collapse}
.ct-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.5fr;gap:8px;padding:8px 14px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);border-bottom:1px solid var(--border)}
.ct-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.5fr;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:.82rem;transition:background .15s;cursor:pointer;align-items:center}
.ct-row:hover{background:var(--srf2)}
.ct-av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.65rem;margin-right:6px;vertical-align:middle}
.ct-name{font-weight:600;display:flex;align-items:center}
.ct-spent{font-weight:700;color:var(--gold)}
.ct-city-badge{padding:2px 8px;border-radius:100px;font-size:.68rem;background:var(--srf2);border:1px solid var(--border)}
/* insights */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ins-card{background:var(--srf);border:1px solid var(--border);border-radius:13px;padding:16px}
.ins-title{font-size:.82rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ins-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.78rem}
.ins-bar{flex:1;height:6px;background:var(--srf2);border-radius:3px;overflow:hidden}
.ins-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),rgba(233,184,74,.5))}
@media(max-width:768px){.page-body{padding:16px}.ct-head,.ct-row{grid-template-columns:2fr 1fr 1fr}.cg{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<script src="../js/seed-data.js"></script>

<nav>
  <a href="../index.html" class="nav-logo"><canvas id="logo-canvas" width="28" height="28"></canvas>Klumora</a>
  <div class="nav-right">
    <span class="admin-badge">🔐 Admin Panel</span>
    <a href="search.html" class="nav-btn">Browse Platform</a>
  </div>
</nav>

<div class="admin-bar">
  <span class="admin-badge">TEST DATA</span>
  <span>This page shows all 50 test creators + 50 test clients for QA and platform testing. Not visible in production.</span>
</div>

<div class="page-body">
  <!-- stats -->
  <div class="stats-grid" id="stats-grid"></div>

  <!-- tabs -->
  <div class="tab-bar">
    <div class="tab active" onclick="switchTab(0,this)">50 Creators</div>
    <div class="tab" onclick="switchTab(1,this)">50 Clients</div>
    <div class="tab" onclick="switchTab(2,this)">Insights</div>
  </div>

  <!-- CREATORS TAB -->
  <div class="tab-content active" id="tab0">
    <div class="search-bar-sm">
      <input type="text" id="creator-search" placeholder="Search by name, city, specialty…" oninput="renderCreators()">
      <select id="creator-type-filter" onchange="renderCreators()">
        <option value="">All types</option>
        <option value="Photographer">Photographer</option>
        <option value="Videographer">Videographer</option>
        <option value="Both">Both</option>
      </select>
      <select id="creator-city-filter" onchange="renderCreators()">
        <option value="">All cities</option>
        <option>London</option><option>Manchester</option><option>Birmingham</option>
        <option>Edinburgh</option><option>Bristol</option><option>Leeds</option><option>Liverpool</option>
      </select>
      <select id="creator-sort" onchange="renderCreators()">
        <option value="id">Default</option>
        <option value="rating">Rating</option>
        <option value="bookings">Bookings</option>
        <option value="price">Price</option>
        <option value="portfolio">Portfolio Score</option>
      </select>
    </div>
    <div id="creator-count" style="font-size:.78rem;color:var(--sub);margin-bottom:12px"></div>
    <div class="cg" id="creators-grid"></div>
  </div>

  <!-- CLIENTS TAB -->
  <div class="tab-content" id="tab1">
    <div class="search-bar-sm">
      <input type="text" id="client-search" placeholder="Search by name, city, email…" oninput="renderClients()">
      <select id="client-city" onchange="renderClients()">
        <option value="">All cities</option>
        <option>London</option><option>Manchester</option><option>Birmingham</option>
        <option>Edinburgh</option><option>Bristol</option><option>Leeds</option><option>Liverpool</option><option>Cardiff</option>
      </select>
      <select id="client-sort" onchange="renderClients()">
        <option value="id">Default</option>
        <option value="bookings">Bookings</option>
        <option value="spent">Total spent</option>
        <option value="joined">Year joined</option>
      </select>
    </div>
    <div id="client-count" style="font-size:.78rem;color:var(--sub);margin-bottom:12px"></div>
    <div style="background:var(--srf);border:1px solid var(--border);border-radius:14px;overflow:hidden">
      <div class="ct-head"><span>Client</span><span>City</span><span>Bookings</span><span>Spent</span><span>Joined</span><span>Favourite specialties</span></div>
      <div id="clients-list"></div>
    </div>
  </div>

  <!-- INSIGHTS TAB -->
  <div class="tab-content" id="tab2">
    <div class="ins-grid" id="insights-grid"></div>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  drawLogo();
  renderStats();
  renderCreators();
  renderClients();
  renderInsights();
});
function switchTab(i,el){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  document.querySelectorAll('.tab-content').forEach((c,j)=>c.classList.toggle('active',j===i));
}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function renderStats(){
  const C=window.KLUMORA_CREATORS||[], U=window.KLUMORA_CLIENTS||[];
  const totalBookings=C.reduce((s,c)=>s+c.bookings,0);
  const totalSpent=U.reduce((s,c)=>s+(c.spent||0),0);
  const avgRating=(C.reduce((s,c)=>s+c.rating,0)/C.length).toFixed(2);
  const insured=C.filter(c=>c.insurance).length;
  const verified=C.filter(c=>c.verified).length;
  const rushable=C.filter(c=>c.rush).length;
  const avgScore=Math.round(C.reduce((s,c)=>s+(c.portfolioScore||0),0)/C.length);
  const stats=[
    {n:C.length,l:'Creators'},
    {n:U.length,l:'Clients'},
    {n:totalBookings.toLocaleString(),l:'Total Bookings'},
    {n:'£'+Math.round(totalSpent/1000)+'k',l:'Client Spend'},
    {n:avgRating,l:'Avg Rating'},
    {n:verified,l:'Verified'},
    {n:insured,l:'Insured'},
    {n:rushable,l:'Rush OK'},
    {n:avgScore,l:'Avg Portfolio'},
  ];
  document.getElementById('stats-grid').innerHTML=stats.map(s=>`<div class="stat-box"><div class="stat-n">${s.n}</div><div class="stat-l">${s.l}</div></div>`).join('');
}
function renderCreators(){
  const C=window.KLUMORA_CREATORS||[];
  const q=document.getElementById('creator-search').value.toLowerCase();
  const tf=document.getElementById('creator-type-filter').value;
  const cf=document.getElementById('creator-city-filter').value;
  const sf=document.getElementById('creator-sort').value;
  let list=C.filter(c=>{
    if(tf&&c.type!==tf) return false;
    if(cf&&c.city!==cf) return false;
    if(q&&!( c.name.toLowerCase().includes(q)||c.city.toLowerCase().includes(q)||c.specs.join(' ').toLowerCase().includes(q)||c.loc.toLowerCase().includes(q))) return false;
    return true;
  });
  if(sf==='rating') list.sort((a,b)=>b.rating-a.rating);
  else if(sf==='bookings') list.sort((a,b)=>b.bookings-a.bookings);
  else if(sf==='price') list.sort((a,b)=>a.price-b.price);
  else if(sf==='portfolio') list.sort((a,b)=>(b.portfolioScore||0)-(a.portfolioScore||0));
  document.getElementById('creator-count').textContent=`${list.length} creators`;
  document.getElementById('creators-grid').innerHTML=list.map(c=>{
    const ini=c.name.split(' ').map(n=>n[0]).join('');
    const score=c.portfolioScore||0;
    const scoreCol=score>=95?'var(--green)':score>=85?'var(--gold)':'var(--sub)';
    return `<div class="cc">
      <div class="cc-top">
        <div class="cc-av" style="background:${hexA(c.c2,.18)};color:${c.c2}">${ini}</div>
        <div>
          <div class="cc-name">${c.name} ${c.verified?'<span style="color:var(--gold);font-size:.75rem">✓</span>':''}</div>
          <div class="cc-meta">${c.type} · ${c.loc}</div>
        </div>
      </div>
      <div class="cc-tags">
        ${c.rush?'<span class="cc-tag green">⚡ Rush</span>':''}
        ${c.instantConfirm?'<span class="cc-tag blue">🟢 Instant</span>':''}
        ${c.insurance?'<span class="cc-tag gold">🛡 Insured</span>':''}
        ${c.repeatDiscount>0?`<span class="cc-tag purple">🔄 ${c.repeatDiscount}%</span>`:''}
      </div>
      <div style="font-size:.72rem;color:var(--sub);margin-bottom:8px">${c.specs.slice(0,4).join(' · ')}</div>
      <div style="font-size:.7rem;color:var(--muted);margin-bottom:8px">🌐 ${(c.languages||[]).join(', ')}</div>
      <div class="cc-stats">
        <div class="cc-stat"><div class="cc-sn">★ ${c.rating}</div><div class="cc-sl">${c.reviews} reviews</div></div>
        <div class="cc-stat"><div class="cc-sn">£${c.price}</div><div class="cc-sl">per hour</div></div>
        <div class="cc-stat"><div class="cc-sn" style="color:${scoreCol}">${score}</div><div class="cc-sl">portfolio</div></div>
      </div>
    </div>`;
  }).join('');
}
function renderClients(){
  const U=window.KLUMORA_CLIENTS||[], C=window.KLUMORA_CREATORS||[];
  const q=document.getElementById('client-search').value.toLowerCase();
  const cf=document.getElementById('client-city').value;
  const sf=document.getElementById('client-sort').value;
  let list=U.filter(u=>{
    if(cf&&u.city!==cf) return false;
    if(q&&!(u.name.toLowerCase().includes(q)||u.city.toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q))) return false;
    return true;
  });
  if(sf==='bookings') list.sort((a,b)=>b.bookings-a.bookings);
  else if(sf==='spent') list.sort((a,b)=>b.spent-a.spent);
  else if(sf==='joined') list.sort((a,b)=>b.joinedYear-a.joinedYear);
  document.getElementById('client-count').textContent=`${list.length} clients`;
  const lb=u=>{const c=C.find(x=>x.id===u.lastBookedId);return c?c.name:'—';};
  document.getElementById('clients-list').innerHTML=list.map(u=>`
    <div class="ct-row">
      <div class="ct-name"><div class="ct-av" style="background:${hexA(u.avatarColor||'#e9b84a',.18)};color:${u.avatarColor||'#e9b84a'}">${u.initials}</div>${u.name}</div>
      <span><span class="ct-city-badge">${u.city}</span></span>
      <span>${u.bookings}</span>
      <span class="ct-spent">£${(u.spent||0).toLocaleString()}</span>
      <span>${u.joinedYear}</span>
      <span style="font-size:.75rem;color:var(--sub)">${(u.favSpecs||[]).slice(0,2).join(', ')}</span>
    </div>`).join('');
}
function renderInsights(){
  const C=window.KLUMORA_CREATORS||[], U=window.KLUMORA_CLIENTS||[];
  // city distribution
  const cities={};C.forEach(c=>{cities[c.city]=(cities[c.city]||0)+1;});
  const maxCity=Math.max(...Object.values(cities));
  // specialty distribution
  const specs={};C.forEach(c=>c.specs.forEach(s=>{specs[s]=(specs[s]||0)+1;}));
  const topSpecs=Object.entries(specs).sort((a,b)=>b[1]-a[1]).slice(0,8);
  // type distribution
  const types={};C.forEach(c=>{types[c.type]=(types[c.type]||0)+1;});
  // avg price by city
  const cityPrices={};const cityCounts={};
  C.forEach(c=>{cityPrices[c.city]=(cityPrices[c.city]||0)+c.price;cityCounts[c.city]=(cityCounts[c.city]||0)+1;});
  const avgPrices=Object.keys(cityPrices).map(city=>({city,avg:Math.round(cityPrices[city]/cityCounts[city])})).sort((a,b)=>b.avg-a.avg);
  // client city
  const clientCities={};U.forEach(u=>{clientCities[u.city]=(clientCities[u.city]||0)+1;});
  document.getElementById('insights-grid').innerHTML=`
    <div class="ins-card">
      <div class="ins-title">🏙 Creators by city</div>
      ${Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([city,n])=>`<div class="ins-bar-row"><span style="min-width:100px">${city}</span><div class="ins-bar"><div class="ins-fill" style="width:${n/maxCity*100}%"></div></div><span style="color:var(--gold);font-weight:700;min-width:24px;text-align:right">${n}</span></div>`).join('')}
    </div>
    <div class="ins-card">
      <div class="ins-title">🎯 Top specialties</div>
      ${topSpecs.map(([spec,n])=>`<div class="ins-bar-row"><span style="min-width:120px;font-size:.75rem">${spec}</span><div class="ins-bar"><div class="ins-fill" style="width:${n/topSpecs[0][1]*100}%"></div></div><span style="color:var(--gold);font-weight:700;min-width:24px;text-align:right">${n}</span></div>`).join('')}
    </div>
    <div class="ins-card">
      <div class="ins-title">📷 Creator types</div>
      ${Object.entries(types).map(([type,n])=>`<div class="ins-bar-row"><span style="min-width:120px">${type}</span><div class="ins-bar"><div class="ins-fill" style="width:${n/C.length*100}%"></div></div><span style="color:var(--gold);font-weight:700;min-width:24px;text-align:right">${n}</span></div>`).join('')}
    </div>
    <div class="ins-card">
      <div class="ins-title">💷 Avg hourly rate by city</div>
      ${avgPrices.map(({city,avg})=>`<div class="ins-bar-row"><span style="min-width:100px">${city}</span><div class="ins-bar"><div class="ins-fill" style="width:${avg/450*100}%"></div></div><span style="color:var(--gold);font-weight:700;min-width:44px;text-align:right">£${avg}</span></div>`).join('')}
    </div>
    <div class="ins-card">
      <div class="ins-title">👥 Clients by city</div>
      ${Object.entries(clientCities).sort((a,b)=>b[1]-a[1]).map(([city,n])=>`<div class="ins-bar-row"><span style="min-width:100px">${city}</span><div class="ins-bar"><div class="ins-fill" style="width:${n/Math.max(...Object.values(clientCities))*100}%"></div></div><span style="color:var(--gold);font-weight:700;min-width:24px;text-align:right">${n}</span></div>`).join('')}
    </div>
    <div class="ins-card">
      <div class="ins-title">✅ Platform quality metrics</div>
      ${[
        ['Verified creators',C.filter(c=>c.verified).length,C.length],
        ['Insured creators',C.filter(c=>c.insurance).length,C.length],
        ['Rush available',C.filter(c=>c.rush).length,C.length],
        ['Instant confirm',C.filter(c=>c.instantConfirm).length,C.length],
        ['Offer discounts',C.filter(c=>c.repeatDiscount>0).length,C.length],
      ].map(([label,n,total])=>`<div class="ins-bar-row"><span style="min-width:140px;font-size:.75rem">${label}</span><div class="ins-bar"><div class="ins-fill" style="width:${n/total*100}%"></div></div><span style="color:var(--gold);font-weight:700;min-width:36px;text-align:right">${Math.round(n/total*100)}%</span></div>`).join('')}
    </div>`;
}
function drawLogo(){const c=document.getElementById('logo-canvas');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,28,28);ctx.strokeStyle='#E9B84A';ctx.lineWidth=1.5;for(let i=0;i<7;i++){ctx.save();ctx.translate(14,14);ctx.rotate(i*Math.PI*2/7);ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(0,-11);ctx.lineTo(6,0);ctx.closePath();ctx.fillStyle=`rgba(233,184,74,${.55+i*.07})`;ctx.fill();ctx.stroke();ctx.restore();}}
</script>
</body>
</html>
